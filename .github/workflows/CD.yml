
## GOAL - The goal of the workflow is to do the continous intergarion of the project and countinous delivery of the LUMAshop project

name: CD workflow

on: 
  workflow_call:
  # push:   ## This will use when you want to run the code by yourself using button.

jobs: 
    Building-application-and-Deploying-it:
      runs-on: self-hosted

      steps:
        - name: clone the code
          uses: actions/checkout@v7
        
        - name: Setup Docker
          uses: docker/setup-docker-action@v4
          with:
            set-host: true
            daemon-config: |
              {
                "iptables": false
              }

        - name: Check Docker
          run: |
            docker --version
            docker version
            docker info
            docker compose version

        - name: Deploy the application using run docker container
          run: docker compose up -d


