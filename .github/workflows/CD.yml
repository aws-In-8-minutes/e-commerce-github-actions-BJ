
## GOAL - The goal of the workflow is to do the continous intergarion of the project and countinous delivery of the LUMAshop project

name: CD workflow

on: 
  workflow_dispatch:   ## This will use when you want to run the code by yourself using button.

jobs: 
    Building application and Deploying it:
      runs-on: self-hosted

      steps:
        - name: clone the clode
          uses: actions/checkout@v7

        - name: Docker installation
          uses: docker/setup-docker-action@v5

        - name: Docker login
          uses: docker/login-action@v4
          with: 
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v4

        - name: Docker build and push
          uses: docker/build-push-action@v7
          with:
            push: true
            tags: ${{ vars.DOCKERHUB_USERNAME }}/e-com-python:latest
            load: true

        - name: Deploy the application using run docker container
          run: docker compose up -d


