name: Show environment variable

on: 
  workflow_dispatch:
    inputs:
      environment: 
       description: Select the Environment from the list
       required: true
       default: dev
       type: choice
       options:
         - dev
         - stg
         - prd

env:
  NAME: Bhagyajeet

jobs:
  Show_variable:
    runs-on: ubuntu-latest
    steps:
      - name: Show plain text env
        run: echo "My name is ${{ env.NAME }}"
     ## Secrets env
      - name: Show Secrets
        run: echo "One fun secret is ${{ secrets.BJ_SECRET }}"
      ## ENV Variable i.e repository variables
      - name: Show env variables
        run: echo "My dockerhub username is ${{ vars.DOCKERHUB_USERNAME }}"
