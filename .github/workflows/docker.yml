
name: Docker Build and Push

on: 
  #workflow_dispatch: 
  workflow_call:   ## This will use when you want to run the code by yourself using button.


jobs: 
  docker-build-and-push:
    runs-on: ubuntu-latest
  
    steps:
      - name: Clone the code
        uses: actions/checkout@v7  ## This is the action which will be used to checkout the code from the repository

      - name: Setup the docker
        uses: docker/setup-docker-action@v5

      - name: Login to DockerHub        
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4


      - name: Build and Push Docker Image   
        uses: docker/build-push-action@v7   ## This is the action which will be used to build and push the docker image to DockerHub
        with: 
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/e-com-python:latest   ## This is the tag which will be used to push the docker image to DockerHub
          load: true     ## This is the load which will be used to load the docker image to DockerHub by using the docker buildx command irrespective of the self hosted runner and system hosts.
