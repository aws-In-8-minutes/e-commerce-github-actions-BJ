
name: Docker Build and Push

on: 
  workflow_dispatch: 


jobs: 
  docker-build-and-push:
    runs-on: ubuntu-latest
  
    steps:
      - name: Clone the code
        uses: actions/checkout@v7  ## This is the action which will be used to checkout the code from the repository

      - name: Setup the docker
        uses: docker/setup-docker-action@v5

      - name: Login to DockerHub        
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image   
        uses: docker/build-push-action@v7   ## This is the action which will be used to build and push the docker image to DockerHub
